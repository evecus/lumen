name: Windows Build

# 触发方式：
#  - push 到 main/master
#  - 打 v* 标签（会额外发布 GitHub Release）
#  - Pull Request / 手动 dispatch（仅验证编译）
on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时发布 Release 需要

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build (windows-latest / x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GPUI 在 Windows 上只需要 MSVC 工具链 + Windows SDK（windows-latest 镜像自带）。
      # 不需要 Vulkan SDK（ash 运行时动态加载 vulkan-1.dll），也不需要 LLVM
      # （gpui 的 bindgen 依赖是 cfg(target_os="macos") 限定的）。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Show toolchain
        run: |
          cargo update 


      # --locked：严格使用仓库里的 Cargo.lock，避免 CI 上意外升级依赖。
      # 新增了 two-face 依赖：本地先 `cargo build` 一次并提交更新后的 Cargo.lock，
      # 之后这里的 --locked 才能通过。
      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Run tests
        run: cargo test --release

      - name: Collect binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/lumen.exe dist/lumen-windows-x86_64.exe
          Get-Item dist/lumen-windows-x86_64.exe | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-x86_64
          path: dist/lumen-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 30

      # 只在打 v* tag 时打包并发布 Release
      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/lumen-windows-x86_64.exe -DestinationPath lumen-windows-x86_64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lumen-windows-x86_64.zip
          generate_release_notes: true
